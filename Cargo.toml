[package]
name = "clipvault"
version = "0.1.0"
edition = "2024"

[lib]
name = "clipvault"
path = "src/lib.rs"

# The CLI: watch / list / search / copy.
[[bin]]
name = "clipvault"
path = "src/main.rs"

[dependencies]
arboard = "3.6.1"
chrono = "0.4.45"
ctrlc = "3.5.2"
dirs = "6.0.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
