[package]
name = "clipvault"
version = "0.1.0"
edition = "2024"

[lib]
name = "clipvault"
path = "src/lib.rs"

# The CLI: watch / list / search / copy.
[[bin]]
name = "clipvault"
path = "src/main.rs"

# The macOS menu bar app.
[[bin]]
name = "clipvault-menubar"
path = "src/bin/clipvault-menubar.rs"

[dependencies]
arboard = "3.6.1"
chrono = "0.4.45"
ctrlc = "3.5.2"
dirs = "6.0.0"
objc2-service-management = "0.3.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

# Menu bar UI. AppKit is only pulled in on macOS so the CLI stays portable.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
global-hotkey = "0.8.0"
muda = "0.19.3"
objc2 = "0.6.4"

[target.'cfg(target_os = "macos")'.dependencies.objc2-foundation]
version = "0.3.2"
features = ["NSDate", "NSNotification", "NSRunLoop", "NSString", "NSTimer", "NSURL", "block2"]

[target.'cfg(target_os = "macos")'.dependencies.objc2-app-kit]
version = "0.3.2"
features = [
    "NSApplication",
    "NSButton",
    "NSControl",
    "NSImage",
    "NSImageView",
    "NSAlert",
    "NSBox",
    "NSBezierPath",
    "NSBitmapImageRep",
    "NSColor",
    "NSEvent",
    "NSFont",
    "NSGradient",
    "NSGraphicsContext",
    "NSImageRep",
    "NSMenu",
    "NSMenuItem",
    "NSPanel",
    "NSParagraphStyle",
    "NSPasteboard",
    "NSPopUpButton",
    "NSScreen",
    "NSResponder",
    "NSRunningApplication",
    "NSStatusBar",
    "NSStatusBarButton",
    "NSShadow",
    "NSStatusItem",
    "NSStringDrawing",
    "NSTextField",
    "NSView",
    "NSVisualEffectView",
    "NSWindow",
    "NSWorkspace",
]

